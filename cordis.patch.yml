# ============================================================================
# dsh-startup-cyrene —— 启动开屏（可配置的多段视频）
# ============================================================================
# 把一个全屏开场遮罩插到 Web 客户端首屏之前：按配置顺序播放本地视频片段，
# 播放结束（或点击跳段）后淡出进界面。
#
# 配置在 ~/.dsh/startup-cyrene.json（缺失时使用内置默认：两段昔涟开屏）。
# 与 dsh-cyrene-whale-widget 的带动画版、dsh-startup-intro 都能叠出两层遮罩，
# 同一台机器上只应启用其中一个开屏来源。
# ============================================================================

- insert:
    - id: dsh-startup-cyrene
      name: dsh-startup-cyrene
